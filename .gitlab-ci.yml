# Mirror this digest-pinned image into the internal GitLab Container Registry
# before air-gapped runners execute CI. Do not pull Docker Hub from the closed network.
image: node:24-alpine@sha256:e67514e5d0f6c46656005e1b693b2ec9d52e80b641307de684d4a015ba7a4eaf

stages:
  - validate
  - catalog

before_script:
  - corepack enable
  - pnpm install --frozen-lockfile

verify:
  stage: validate
  script:
    - pnpm verify

create_catalog_merge_request:
  stage: catalog
  needs: ["verify"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CATALOG_ISSUE_IID && $CATALOG_APPROVED_DESCRIPTION_SHA256'
      when: manual
      allow_failure: false
    - when: never
  script:
    - node scripts/create-catalog-mr-from-gitlab-issue.mjs
