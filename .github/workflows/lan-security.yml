name: LAN security scan
on:
  # This workflow MUST NOT check out or execute PR source. It only queues immutable IDs.
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: '37 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: lan-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    name: Request and await isolated LAN scan
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - name: Read only the private trusted queue controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ShalevZ923/lan-security-worker
          ref: main
          path: queue
          ssh-key: ${{ secrets.LAN_SECURITY_QUEUE_KEY }}
          persist-credentials: true
      - name: Queue exact source commit and await redacted result
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 queue/ci_bridge.py
