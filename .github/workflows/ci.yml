name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    uses: ./.github/workflows/acceptance.yml

  verify:
    name: Verify source and production artifact
    needs: acceptance
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require complete acceptance
        env:
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
        run: test "$ACCEPTANCE_RESULT" = success

  container-smoke:
    name: Build and smoke-test production image
    needs: acceptance
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require complete acceptance
        env:
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
        run: test "$ACCEPTANCE_RESULT" = success
