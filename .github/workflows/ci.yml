name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source and production artifact
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify
        run: pnpm verify
      - name: Build and audit tracked evaluation archives
        run: pnpm agents:packages
      - name: Install browser
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps chromium
      - name: Focused browser regressions
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chromium
        run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-evidence-pnpm-${{ matrix.os }}
          path: test-results
          if-no-files-found: ignore

  verify-required:
    name: Verify source and production artifact
    needs: [verify, npm-verify, container-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful verification on every platform
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          NPM_RESULT: ${{ needs.npm-verify.result }}
          CONTAINER_RESULT: ${{ needs.container-smoke.result }}
        run: test "$VERIFY_RESULT" = success && test "$NPM_RESULT" = success && test "$CONTAINER_RESULT" = success

  npm-verify:
    name: Verify npm-only installation and build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies with npm
        run: npm ci
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify with npm
        run: npm run verify
      - name: Build and audit tracked evaluation archives
        run: npm run agents:packages
      - name: Install browser
        timeout-minutes: 10
        run: npm exec -- playwright install --with-deps chromium
      - name: Focused browser regressions
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chromium
        run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-evidence-npm-${{ matrix.os }}
          path: test-results
          if-no-files-found: ignore

  container-smoke:
    name: Build and smoke-test production image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --tag tool-atlas:ci --build-arg VERSION=ci --build-arg VCS_REF=${{ github.sha }} .
      - name: Smoke test hardened image
        run: |
          set -euo pipefail
          container_id=$(docker run --detach --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m --publish 127.0.0.1:18080:8080 tool-atlas:ci)
          trap 'docker rm --force "$container_id" >/dev/null' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --head http://127.0.0.1:18080/; then break; fi
            sleep 1
          done
          test "$(docker inspect --format '{{.Config.User}}' tool-atlas:ci)" = "nginx"
          curl --fail --silent --show-error --head http://127.0.0.1:18080/ | grep --ignore-case '^content-security-policy:'
          curl --fail --silent --show-error --head http://127.0.0.1:18080/ | grep --ignore-case '^cache-control: no-store'
          curl --fail --silent --show-error --head http://127.0.0.1:18080/catalog/v1/index.json | grep --ignore-case '^cache-control: public, max-age=60'
      - name: Build optional local Studio image
        run: docker build --target studio --tag tool-atlas:studio-ci .
      - name: Test optional Caddy settings, health, and local Studio
        run: node scripts/smoke-docker.mjs tool-atlas:ci tool-atlas:studio-ci
