name: Create catalog pull request from approved issue

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  create-catalog-pr:
    if: github.event.label.name == 'catalog-approved' && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    concurrency:
      group: catalog-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Create and validate the catalog entry
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="catalog/issue-${ISSUE_NUMBER}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "A catalog branch already exists for issue ${ISSUE_NUMBER}."
            exit 0
          fi
          git switch --create "$branch"
          node scripts/create-catalog-entry-from-issue.mjs
          corepack enable
          pnpm install --frozen-lockfile
          pnpm verify
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/catalog src/generated/catalog.ts
          git commit -m "content: add catalog entry from issue #${ISSUE_NUMBER}"
          git push origin "$branch"
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch" \
            --title "Catalog entry from issue #${ISSUE_NUMBER}" \
            --body "Created from approved catalog submission #${ISSUE_NUMBER}. Review the generated content, approved release target, and guide before merging."
