name: tool-atlas

services:
  app:
    build:
      context: .
      args:
        VITE_APP_VERSION: ${VITE_APP_VERSION:-1.8.0}
    image: ${TOOL_ATLAS_IMAGE:-tool-atlas:local}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "8080"
    volumes:
      - ./packages:/srv/tool-atlas-packages:ro
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  proxy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - edge_network
      - app_network

networks:
  edge_network:
  app_network:
    internal: true

volumes:
  caddy_data:
  caddy_config:
