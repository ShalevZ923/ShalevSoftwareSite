pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  # Only Caddy on the internal Docker network should reach this origin.
  # Trust X-Forwarded-For from private peers so download logs show the
  # visitor, not the gateway, without letting a direct client spoof remote.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.0/8;
  set_real_ip_from ::1;
  set_real_ip_from fc00::/7;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  log_format json_combined escape=json '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent}';
  access_log /dev/stdout json_combined;
  # Keep optional HTTP deployments usable; apply HTTPS upgrade policy only
  # when Caddy reports a TLS request.
  map $http_x_forwarded_proto $tool_atlas_https_csp {
    default "";
    https "; upgrade-insecure-requests";
  }
  map $uri $tool_atlas_cache_control {
    default "no-store";
    ~^/downloads/ "private, no-store";
    ~^/catalog/v1/ "public, max-age=60";
    ~*\.(?:css|js|mjs|svg|woff2?|png|jpe?g|webp|ico)$ "public, max-age=31536000, immutable";
  }
  map $uri $tool_atlas_content_disposition {
    default "";
    ~^/downloads/ "attachment";
  }
  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'$tool_atlas_https_csp" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cache-Control $tool_atlas_cache_control always;
    add_header Content-Disposition $tool_atlas_content_disposition always;

    location = /_headers { return 404; }

    location = /api/health {
      default_type application/json;
      return 200 '{"status":"ok"}\n';
    }

    # This is a read-only static application. Keeping the method surface small
    # avoids accepting unexpected request bodies at the origin.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location = /index.html {
      try_files $uri =404;
    }

    location = /downloads { return 404; }

    location ^~ /downloads/ {
      if ($uri !~ ^/downloads/[a-z0-9]+(?:-[a-z0-9]+)*/[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*\.(?:exe|msi|msix|zip|dmg|pkg|deb|rpm)$) { return 404; }
      alias /srv/tool-atlas-packages/;
      autoindex off;
      disable_symlinks on;
    }

    location ~* \.(?:css|js|mjs|svg|woff2?|png|jpe?g|webp|ico)$ {
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
